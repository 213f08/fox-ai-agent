spring:
  application:
    name: Fox-ai-agent
  profiles:
    # 开发默认 local（密钥在 application-local.yml，已 gitignore）；
    # 部署时通过环境变量 SPRING_PROFILES_ACTIVE=prod 切换（见 application-prod.yml 与 .env.example）
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    mcp:
      client:
        # 图片搜索 MCP 连接已按环境拆分：
        #   - 本地开发（local profile）→ application-local.yml 的 sse.connections（连 localhost:8127）
        #   - 生产（prod profile）→ 默认【不连 MCP】：云托管 / FC 等单容器环境没有 MCP 服务时
        #     可直接启动；需要图片搜索时取消 application-prod.yml 里 MCP 段的注释。
        # 注意：MCP client 同步握手超时(20s)会拖崩整个应用启动 ——
        # 没部署 MCP 服务的环境千万不要在这里配 connections。
        # 属性结构见 spring-ai-autoconfigure-mcp-client-common 1.1.2 的 McpSseClientProperties：
        # CONFIG_PREFIX=spring.ai.mcp.client.sse，Map<String, SseParameters> connections（复数 connections，写单数会被静默忽略）
        # 高德 MCP 见下方注释（当前不可用：INVALID_USER_KEY 10001）
        # streamable-http:
        #   connections:
        #     amap-maps:
        #       url: https://mcp.amap.com/mcp?key=${amap.api-key}
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
        initialize-schema: true

server:
  port: 8123
  servlet:
    context-path: /api

# 饮食健康助手业务配置
customer-app:
  # 百炼云知识库名称（需在百炼控制台创建同名知识库并上传 document/*.md，用名称不是 ID）。
  # 云端 RAG 依赖它；本地 RAG 走 document/*.md 的 SimpleVectorStore。
  knowledge-index: 饮食健康知识库
  rag:
    # 本地知识库检索的相似度下限（余弦相似度 0~1）。低于该分数的文档视为「没命中」：
    # 不注入 prompt，前端也不显示检索过程 —— 闲聊/无意义输入就是靠它挡掉的。
    # 阈值 0 会让任何输入都返回 topK 条，看起来像"随便问一句也走了 RAG"。
    # 0.6 是实测定标：真实饮食问题 0.71~0.75，闲聊/跑题 0.48~0.55，取中间留足余量。
    # 想改看日志：[小养RAG] 检索命中 N 篇，阈值 x，最高分 y
    similarity-threshold: 0.6
    # 单次检索返回的最大文档数
    top-k: 4

# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.foxaiagent.controller

# knife4j 接口文档增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.example.foxaiagent.advisor: debug # 自定义 MyLoggerAdvisor 的 BEFORE/AFTER 日志
    org.springframework.ai.mcp: info # MCP 客户端连接 / 工具注册日志
    io.modelcontextprotocol: info # MCP 底层传输日志