# ============================================================
# 前端 Nginx 配置（静态资源 + /api 反向代理到后端）
# 用途：同一域名提供页面与 API，规避浏览器跨域；SSE 长连接关闭缓冲
# ============================================================
server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;

    # ---- SPA 路由兜底 ----
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ---- /api 反向代理到 Fox 后端（云托管）----
    location ^~ /api/ {
        # 改成你自己的后端域名（保留 /api/ 后缀）
        proxy_pass https://fox-ai-agent-backend-309816-9-1483077047.sh.run.tcloudbase.com/api/;

        # Host 只需域名，不带 https://
        proxy_set_header Host fox-ai-agent-backend-309816-9-1483077047.sh.run.tcloudbase.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 流式必需：关缓冲、保长连接 ----
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_intercept_errors off;
    }

    # ---- 静态资源长缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
