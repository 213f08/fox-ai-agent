spring:
  application:
    name: Fox-ai-agent
  profiles:
    active: local # 默认启用 local 配置


server:
  port: 8123
  servlet:
    context-path: /api

# 智能客服业务配置
customer-app:
  knowledge-index: 客服助手知识库
  # 云知识库名称（需在百炼控制台创建同名知识库，用名称不是 ID）

# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.foxaiagent.controller

# knife4j 接口文档增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.example.foxaiagent.Advisor: debug # 自定义 MyLoggerAdvisor 的 BEFORE/AFTER 日志